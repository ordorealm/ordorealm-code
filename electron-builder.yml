# Electron Builder Configuration
# OrdoRealm Code - 序境智码

appId: com.ordorealm.code
productName: OrdoRealm Code
copyright: Copyright © 2024 OrdoRealm

# asar 配置 - 解压包含原生二进制的 node_modules
asar: true
asarUnpack:
  # macOS 原生二进制
  - "**/node_modules/@anthropic-ai/claude-agent-sdk-darwin-x64/**/*"
  - "**/node_modules/@anthropic-ai/claude-code-darwin-x64/**/*"
  - "**/node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/**/*"
  - "**/node_modules/@anthropic-ai/claude-code-darwin-arm64/**/*"
  # Windows 原生二进制
  - "**/node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/**/*"
  - "**/node_modules/@anthropic-ai/claude-code-win32-x64/**/*"
  # 通用工具
  - "**/node_modules/7zip-bin/**/*"

# Directories
directories:
  output: release
  buildResources: build

# Files to include
files:
  - out/**/*
  - package.json
  - "!**/*.{ts,tsx,map}"
  - "!src/**"
  - "!tests/**"
  - "!*.md"

# Extra resources
extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"

# macOS configuration
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Bundled runtimes — only include darwin binaries
  extraResources:
    - from: electron/runtime/node/darwin-x64
      to: runtime/node/darwin-x64
    - from: electron/runtime/node/darwin-x64/lib/node_modules
      to: runtime/node/darwin-x64/lib/node_modules
    - from: electron/runtime/weclaw/darwin-x64
      to: runtime/weclaw/darwin-x64
    - from: electron/runtime/node/darwin-arm64
      to: runtime/node/darwin-arm64
    - from: electron/runtime/node/darwin-arm64/lib/node_modules
      to: runtime/node/darwin-arm64/lib/node_modules
    - from: electron/runtime/weclaw/darwin-arm64
      to: runtime/weclaw/darwin-arm64

# Windows configuration
win:
  icon: resources/icon-win-256x256.png
  target:
    - target: nsis
      arch:
        - x64
  # Bundled runtimes — only include win32 binaries
  extraResources:
    - from: electron/runtime/node/win-x64
      to: runtime/node/win-x64
    - from: electron/runtime/node/win-x64/node_modules
      to: runtime/node/win-x64/node_modules
    - from: electron/runtime/weclaw/win32-x64
      to: runtime/weclaw/win32-x64
    - from: electron/runtime/git/win-x64
      to: runtime/git/win-x64

# Linux configuration
linux:
  icon: build/icons
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: OrdoRealm Team

# NSIS installer configuration (Windows)
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: true
  include: "build/installer.nsh"

# DMG configuration (macOS)
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Auto-update configuration
publish:
  provider: github
  owner: ordorealm
  repo: ordorealm-code
  releaseType: release

# Before build hooks
beforeBuild: null

# After build hooks
afterSign: null
